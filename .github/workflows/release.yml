name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions: {}

jobs:
  release:
    name: Keylessly attest and publish
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: spice-framework/.github/.github/workflows/go-module-release.yml@a8f9cc6ffd3a2744c5cae3b52c05e6e91cbc875e
    with:
      module: github.com/spice-framework/spice-agent
      workflow_commit: a8f9cc6ffd3a2744c5cae3b52c05e6e91cbc875e
