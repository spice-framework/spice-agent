version: "2"
run:
  timeout: 10m
  tests: true
  modules-download-mode: vendor
  allow-serial-runners: true
linters:
  default: none
  enable: [asciicheck, bidichk, containedctx, cyclop, depguard, durationcheck, errcheck, errorlint, fatcontext, forbidigo, forcetypeassert, gocheckcompilerdirectives, gocritic, godoclint, govet, ineffassign, maintidx, modernize, nilerr, nilnesserr, nilnil, noctx, nolintlint, predeclared, recvcheck, revive, sloglint, staticcheck, testableexamples, thelper, tparallel, unconvert, unparam, unused, usestdlibvars, wastedassign]
  settings:
    cyclop: {max-complexity: 20, package-average: 12}
    depguard:
      rules:
        public-core:
          list-mode: lax
          files: ["**/*.go"]
          deny:
            - {pkg: "github.com/spice-framework/toolchain", desc: "runtime packages must not depend on the compiler toolchain"}
            - {pkg: "github.com/spice-framework/spice/internal", desc: "public packages must not depend on Spice internals"}
    errcheck: {check-type-assertions: true}
    forbidigo:
      analyze-types: true
      forbid:
        - {pattern: '^fmt\.Print(f|ln)?$', msg: "write through an injected writer or logger"}
        - {pattern: '^log\.Fatal(f|ln)?$', msg: "return an error to the entrypoint"}
        - {pattern: '^os\.Exit$', msg: "return an error to the entrypoint"}
    govet: {enable-all: true, disable: [fieldalignment]}
    maintidx: {under: 25}
    nolintlint: {require-specific: true, require-explanation: true}
    revive:
      severity: warning
      rules: [{name: comment-spacings, arguments: ["@"]}]
    staticcheck: {checks: [all]}
  exclusions:
    generated: strict
    warn-unused: true
    rules:
      - {path: "_test\\.go$", linters: [cyclop, forbidigo, maintidx, noctx]}
      - {path: "internal/qualitygate/main\\.go$", linters: [forbidigo]}
formatters:
  enable: [gofumpt, goimports]
  settings:
    gofumpt: {module-path: github.com/spice-framework/spice-agent}
issues: {max-issues-per-linter: 0, max-same-issues: 0, uniq-by-line: true}
output: {sort-order: [file, linter]}
