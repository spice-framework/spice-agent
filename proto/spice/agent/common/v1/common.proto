syntax = "proto3";

package spice.agent.common.v1;

option go_package = "github.com/spice-framework/spice-agent/common/v1;commonv1";

// ErrorCode classifies safe protocol outcomes independently of gRPC transport.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_OK = 1;
  ERROR_CODE_INVALID_ARGUMENT = 2;
  ERROR_CODE_UNAUTHENTICATED = 3;
  ERROR_CODE_INCOMPATIBLE_VERSION = 4;
  ERROR_CODE_MISSING_CAPABILITY = 5;
  ERROR_CODE_NOT_FOUND = 6;
  ERROR_CODE_OUT_OF_RANGE = 7;
  ERROR_CODE_RESOURCE_EXHAUSTED = 8;
  ERROR_CODE_UNAVAILABLE = 9;
  ERROR_CODE_CANCELLED = 10;
  ERROR_CODE_DEADLINE_EXCEEDED = 11;
  ERROR_CODE_CONFLICT = 12;
  ERROR_CODE_STALE_CLIENT = 13;
  ERROR_CODE_UNCERTAIN_OPERATION = 14;
  ERROR_CODE_SNAPSHOT_VERSION_MISMATCH = 15;
  ERROR_CODE_INTERNAL = 16;
}

// HealthState is a bounded readiness state exposed to local clients.
enum HealthState {
  HEALTH_STATE_UNSPECIFIED = 0;
  HEALTH_STATE_STARTING = 1;
  HEALTH_STATE_READY = 2;
  HEALTH_STATE_DEGRADED = 3;
  HEALTH_STATE_STOPPING = 4;
}

// ProtocolVersion is one negotiated semantic wire version.
message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
}

// ProtocolRange is an inclusive compatibility interval.
message ProtocolRange {
  ProtocolVersion minimum = 1;
  ProtocolVersion maximum = 2;
}

// BuildIdentity identifies one client or daemon build without secrets.
message BuildIdentity {
  string component = 1;
  string version = 2;
  string commit = 3;
  string go_version = 4;
}

// CapabilitySet contains sorted unique portable capability names.
message CapabilitySet {
  repeated string names = 1;
}

// Limits are bounded protocol capacities. In initialization request/response
// fields they are per-connection requested/selected limits. In Health.limits
// they are the server-configured global capacities used to validate health.
message Limits {
  uint64 max_message_bytes = 1;
  uint32 max_collection_items = 2;
  uint32 max_replay_events = 3;
  uint64 max_replay_bytes = 4;
  uint32 max_concurrent_streams = 5;
  uint32 max_active_runs = 6;
}

// Health is the non-secret daemon readiness summary.
message Health {
  HealthState state = 1;
  repeated string degraded_reasons = 2;
  uint64 active_runs = 3;
  // limits are server-global configured capacities, not the potentially lower
  // limits negotiated for one client connection.
  Limits limits = 4;
}

// VersionMismatch reports the observed and accepted protocol ranges.
message VersionMismatch {
  ProtocolRange client = 1;
  ProtocolRange server = 2;
}

// CapabilityMismatch reports required capabilities that are unavailable.
message CapabilityMismatch {
  repeated string required = 1;
  repeated string available = 2;
  repeated string missing = 3;
}

// ReplayBounds reports the retained event window and recovery cursor.
message ReplayBounds {
  uint64 requested_after_sequence = 1;
  uint64 earliest_sequence = 2;
  uint64 latest_sequence = 3;
  uint64 recovery_sequence = 4;
}

// Overload reports a bounded resource limit without server internals.
message Overload {
  string resource = 1;
  uint64 limit = 2;
  uint64 observed = 3;
}

// StaleClient reports an ownership epoch mismatch.
message StaleClient {
  uint64 expected_epoch = 1;
  uint64 observed_epoch = 2;
}

// SnapshotVersionMismatch reports a rejected snapshot format.
message SnapshotVersionMismatch {
  string expected = 1;
  string observed = 2;
}

// UncertainOperation identifies a mutation whose commit outcome is unknown.
message UncertainOperation {
  string operation_id = 1;
  string operation_kind = 2;
}

// Status is the typed, safe application-level result carried by responses.
message Status {
  ErrorCode code = 1;
  string message = 2;
  bool retryable = 3;
  string operation_id = 4;
  oneof detail {
    VersionMismatch version_mismatch = 10;
    CapabilityMismatch capability_mismatch = 11;
    ReplayBounds replay_bounds = 12;
    Overload overload = 13;
    StaleClient stale_client = 14;
    SnapshotVersionMismatch snapshot_version_mismatch = 15;
    UncertainOperation uncertain_operation = 16;
  }
}
